<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skylark BI Agent</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f4f5f7; color: #1a1d21; display: flex; flex-direction: column; height: 100vh;
    }
    header { padding: 16px 20px; background: #12233f; color: #fff; }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 4px 0 0; font-size: 12px; opacity: 0.75; }
    #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 720px; }
    .msg.user { align-self: flex-end; background: #12233f; color: #fff; padding: 10px 14px; border-radius: 10px 10px 2px 10px; }
    .msg.agent { align-self: flex-start; background: #fff; border: 1px solid #dfe3e8; border-radius: 10px; padding: 14px 16px; }
    .msg.agent .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #6b7280; margin: 10px 0 4px; }
    .msg.agent .section-title:first-child { margin-top: 0; }
    .msg.agent ul { margin: 4px 0; padding-left: 18px; }
    .msg.agent .answer { font-weight: 600; font-size: 15px; }
    .confidence { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-top: 8px; }
    .confidence.High { background: #dcfce7; color: #166534; }
    .confidence.Medium { background: #fef3c7; color: #92400e; }
    .confidence.Low { background: #fee2e2; color: #991b1b; }
    #inputRow { display: flex; gap: 8px; padding: 16px 20px; background: #fff; border-top: 1px solid #e5e7eb; }
    #inputRow input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    #inputRow button { padding: 10px 18px; border: none; border-radius: 8px; background: #12233f; color: #fff; font-size: 14px; cursor: pointer; }
    #inputRow button:disabled { opacity: 0.5; cursor: default; }
    .loading { font-style: italic; color: #6b7280; }
  </style>
</head>
<body>
  <header>
    <h1>Skylark BI Agent</h1>
    <p>Ask about pipeline, revenue, operations, or sector performance from live Monday.com data.</p>
  </header>
  <div id="log"></div>
  <form id="inputRow">
    <input id="messageInput" type="text" placeholder="e.g. What's our open pipeline in Energy?" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
  <script src="/chat.js"></script>
</body>
</html>
